<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - AI Acne Detection</title>
    <!-- Modern Font: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <style>
        .admin-section {
            padding: 60px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .admin-section h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05); /* Slight glassmorphism */
            backdrop-filter: blur(10px);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-table th,
        .user-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            color: #f1f1f1;
        }

        .user-table th {
            background-color: rgba(59, 130, 246, 0.2); /* Blue tint */
            font-weight: 600;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .user-table tr:hover td {
            background-color: rgba(255, 255, 255, 0.05);
            transition: background-color 0.3s ease;
        }
        
        .role-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .role-admin {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .role-user {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
    </style>
</head>

<body id="admin-page">

    <header>
        <div class="logo">🩺 AI Acne Detection - Admin</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="upload.html">Upload</a>
            <!-- auth.js will inject dynamic links here -->
        </nav>
    </header>

    <section class="admin-section">
        <h2>Registered Users</h2>
        <p>Manage users registered in the system.</p>

        <table class="user-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody id="userList">
                <tr>
                    <td colspan="2" style="text-align: center;">Loading users...</td>
                </tr>
            </tbody>
        </table>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userRole = localStorage.getItem('userRole');
            if (userRole !== 'admin') {
                 // Auth.js also handles this, but secondary protection
                 window.location.href = 'index.html';
                 return;
            }

            try {
                const response = await fetch('/api/admin/users');
                if (response.ok) {
                    const users = await response.json();
                    const tbody = document.getElementById('userList');
                    
                    if (users.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="2" style="text-align: center;">No users found.</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = users.map(user => `
                        <tr>
                            <td>${user.username}</td>
                            <td>
                                <span class="role-badge ${user.role === 'admin' ? 'role-admin' : 'role-user'}">
                                    ${user.role.toUpperCase()}
                                </span>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    document.getElementById('userList').innerHTML = `<tr><td colspan="2" style="text-align: center; color: #ef4444;">Failed to load users. Are you an admin?</td></tr>`;
                }
            } catch (err) {
                console.error("Error fetching users:", err);
                document.getElementById('userList').innerHTML = `<tr><td colspan="2" style="text-align: center; color: #ef4444;">Server error while loading users.</td></tr>`;
            }
        });
    </script>

    <footer>
        <p>© 2026 AI Acne Detection System</p>
    </footer>

</body>

</html>
